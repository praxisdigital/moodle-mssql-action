name: 'Setup MS SQL'
description: 'Setup a MS SQL database'
author: 'moxis'
branding:
  icon: 'database'
  color: 'purple'
inputs:
  host_port:
    description: 'The port of host'
    required: false
    default: 1433
  container_port:
    description: 'The port of container'
    required: false
    default: 1433
  collation_server:
    description: '--collation-server - The character collation of MS SQL server'
    required: false
    default: 'Latin1_General_CI_AS'
  mssql_version:
    description: 'Version of MS SQL to use'
    required: false
    default: '2022-latest'
  mssql_root_password:
    description: 'MSSQL_SA_PASSWORD - root superuser password'
    required: false
    default: '123qweASD'
  mssql_database:
    description: 'MSSQL_DATABASE - name for the default database that is created'
    required: false
    default: 'test'
  mssql_user:
    description: 'MSSQL_USER - name for the default user that is created'
    required: false
    default: 'test'
  mssql_password:
    description: 'MSSQL_PASSWORD - password for the default user that is created'
    required: false
    default: 'test'
  mssql_tools_path:
    description: 'Path to mssql-tools. This is used to run sqlcmd for creating custom databases, users, etc.'
    required: false
    default: '/opt/mssql-tools18/bin/sqlcmd'
runs:
  using: 'docker'
  image: 'Dockerfile'
